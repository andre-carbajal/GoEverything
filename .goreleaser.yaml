version: 2

project_name: goeverything

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: ge
    main: ./cmd/ge
    binary: ge
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - name: goeverything
    repository:
      owner: andre-carbajal
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/andre-carbajal/GoEverything
    description: Fast local file indexing and search for macOS (Everything-style)
    license: MIT
    test: |
      system "#{bin}/ge", "--help"
