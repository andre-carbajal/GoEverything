version: 2

project_name: goeverything

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: ge-darwin
    main: ./cmd/ge
    binary: ge
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
  - id: ge-windows
    main: ./cmd/ge
    binary: ge
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: darwin
    formats: [tar.gz]
    ids:
      - ge-darwin
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
  - id: windows
    formats: [zip]
    ids:
      - ge-windows
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - name: goeverything
    ids:
      - darwin
    directory: Formula
    repository:
      owner: andre-carbajal
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/andre-carbajal/GoEverything
    description: Fast local file indexing and search
    license: GPL v3
    test: |
      system "#{bin}/ge", "--help"

scoops:
  - name: goeverything
    ids:
      - windows
    repository:
      owner: andre-carbajal
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: https://github.com/andre-carbajal/GoEverything
    description: Fast local file indexing and search
    license: GPL v3
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
